<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box Lời Chúa</title>
<style>
:root { 
    --xanh: #115e07; 
    --blue: #0f6204; 
    --den: #ffffff; 
    --xam: #ffffff; 
    --bg: #046c04; 
} 

* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; } 
body { background: #ffffff; padding: 15px; } 

.sh-khoi-bao-ve-he-thong {
    max-width: 1200px;
    margin: 0 auto;
    
}

.t-header { 
    display: flex; 
    justify-content: space-between; 
    align-items: flex-end; 
    border-bottom: 1px solid #db5d2b; 
    margin-bottom: 15px; 
    padding-bottom: 5px; 
} 
.t-title { 
    font-size: 18px; 
    font-weight: bold; 
    text-transform: uppercase; 
    color: #ff8c5e; 
} 
.t-tabs { display: flex; } 
.t-btn { 
    font-size: 16px; 
    font-weight: bold; 
    color: #f18305; 
    cursor: pointer; 
    padding: 0 12px 5px 12px; 
    margin-left: 5px; 
    border-bottom: 1px solid transparent; 
    transition: all 0.2s; 
} 
.t-btn.active, 
.t-btn:hover { 
    color: #d80000; 
  
} 
.box-flex { 
    display: flex; 
    width: 100%;
    height: 520px; 
    border: 1px solid #ddd; 
    border-radius: 8px; 
    overflow: hidden; 
    background: #fafafa; /*MÀU NỀN BOX LỚN*/ 
    position: relative; 
} 
.col-left { 
    width: 65%; 
    padding: 30px; 
    border-right: 2px solid #eee; 
   /* ĐÃ XÓA dòng cursor: pointer ở đây */
} 

.img-wrap { 
    width: 100%; 
    height: 380px; 
    overflow: hidden; 
    border-radius: 6px; 
    background: #ffffff; 
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer; /* THÊM DÒNG NÀY: Để rê chuột vào ảnh đại diện lớn hiện bàn tay click */
} 

.img-big { 
    width: 100%;
    height: 100%;
    object-fit: fill; 
    display: block; 
    transition: opacity 0.2s; 
} 
.p-title { 
    font-size: 18px; 
    font-weight: bold; 
    margin: 15px 0 8px 0; 
    color: #0e7007; 
    line-height: 1.4; 
    text-align: left !important; 
    cursor: pointer; /* THÊM DÒNG NÀY: Để rê chuột vào tiêu đề lớn hiện bàn tay click */
    display: block; /* THÊM DÒNG NÀY: Giúp vùng click vừa vặn với chữ */
    width: 100% !important; 
} 
.p-title:hover {
    text-decoration: underline; /* THÊM KHỐI NÀY: Gạch chân tiêu đề khi rê chuột vào */
    color: #4b9956 !important; /* THÊM KHỐI NÀY: Đổi màu tiêu đề khi rê chuột vào */
}

 
.p-desc { 
    font-size: 14px; 
    color: #000000; 
    line-height: 1.5; 
    text-align: left !important;
    display: block !important; 
} 

.col-right { 
    width: 35%; 
    display: flex; 
    flex-direction: column; 
    background: #fFfFfa; 
    position: relative; 
    z-index: 1;
    padding-top: 10px;
     height: 500px;       /* Khống chế chiều cao bằng với khối ảnh lớn bên trái */
    overflow-y: auto; 
} 

.row-news { 
   display: flex; 
   align-items: center; 
   padding: 12px 15px; 
   border-bottom: 1px solid #eee; 
   cursor: pointer; 
   border-left: 4px solid transparent; 
   transition: all 0.2s;
} 
 
.row-news:last-child { border-bottom: none; } 

.row-news:hover {
    background: #f1fcf5;
    border-left-color: #f1fcf5;
}
.row-news:hover .r-title {
    color: #4b9956 !important; 
}
.row-news:hover .r-date {
    color: #000000 !important;
}

.row-news.active { 
    background: #e4f1e9; 
    border-left-color: #115e07;

    }
.row-news.active .r-title {
    color: #115e07 !important; 
    
}

.thumb-wrap { 
    width: 80px; 
    min-width: 80px; 
    height: 55px; 
    margin-right: 12px; 
    overflow: hidden; 
    border-radius: 4px; 
    border: 1px solid #000000;
    background: #ffffff; 
}
 
.img-thumb { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
} 

.txt-wrap { overflow: hidden; } 

.r-title { 
    font-size: 14px; 
    font-weight: 600; 
    color: #000000 !important; 
    line-height: 1.4; 
    text-align: left; 
} 

.r-date { 
    font-size: 11px; 
    color: #000000 !important; 
    margin-top: 4px; 
    text-align: left; 
} 

/* =========================================================
   TỰ ĐỘNG CHUYỂN ĐỔI GIAO DIỆN ĐIỆN THOẠI CHO HỘP LỜI CHÚA
========================================================= */
@media (max-width: 768px) {
    /* 1. Xóa khoảng trống đệm lề mặc định của body */
    body {
        padding: 5px !important;
    }

    /* 2. Ép cấu trúc Flexbox chuyển từ hàng ngang thành hàng dọc */
      .box-flex {
        display: flex !important;
        flex-direction: column !important;
        
        height: auto !important;         /* Hủy chiều cao cố định để không sinh cuộn dọc */
        overflow: visible !important;    /* ➔ THÊM DÒNG NÀY: Cho phép nội dung hiển thị tự do, triệt tiêu thanh cuộn ngoài */
    }

    /* 3. Ép khung xem trước bên trái mở rộng 100% màn hình dọc */
     .col-left {
        width: 100% !important;
        height: auto !important;         /* Cho phép tự co giãn theo nội dung chữ */
        padding: 15px !important;
        border-right: none !important;
        border-bottom: 1px solid #ddd;
    }

    /* 4. Hạ bớt chiều cao vùng ảnh lớn cho cân đối với màn hình dọc */
    .img-wrap {
        height: 220px !important;
    }

    /* 5. Ép danh sách tin bài bên phải mở rộng 100% và khống chế vùng cuộn dọc */
      .col-right {
        width: 100% !important;
        
        /* Cài đặt không gian vuốt lướt tin tức vừa vặn ngón tay trên di động */
        height: 250px !important;        /* Chiều cao của riêng vùng danh sách bài viết */
        overflow-y: auto !important;     /* ➔ GIỮ NGUYÊN dòng này để làm thanh cuộn duy nhất */
        
        background: #ffffff !important;
    }

    /* Tối ưu các nút tab tiêu đề trên điện thoại cho khỏi tràn hàng */
    .t-header {
        flex-direction: column !important;
        align-items: flex-start !important;
        gap: 10px !important;
    }
    .t-tabs {
        width: 100% !important;
        overflow-x: auto !important; /* Tự động mọc cuộn ngang nếu tab quá dài */
        padding-bottom: 5px;
    }
    .t-btn {
        font-size: 14px !important;
        padding: 0 8px 5px 8px !important;
        white-space: nowrap !important; /* Chống rớt chữ xuống dòng */
    }
}

</style>

var currentUrl = ""; 

// 1. HÀM TẠO DANH SÁCH BÀI VIẾT (XÓA BỎ CHỮ ACTIVE TỰ ĐỘNG TRONG VÒNG LẶP)
function render(data) {
    var zone = document.getElementById("list-zone"); 
    var html = ""; 
    window.activeData = data; 
    
    for (var i = 0; i < data.length; i++) {
        // Mặc định tất cả dòng tin ban đầu đều là chữ thường, không tự ý chèn chữ active nữa
        var imgHtml = (data[i].img && !data[i].img.includes("ibb.co")) ? '<img src="' + data[i].img + '" class="img-thumb">' : '';
        html += '<div class="row-news" onclick="changeNews(' + i + ', this)">' +
                '<div class="thumb-wrap">' + imgHtml + '</div>' +
                '<div class="txt-wrap"><div class="r-title">' + data[i].title + '</div><div class="r-date">📅 ' + data[i].date + '</div></div>' +
                '</div>';
    }
    zone.innerHTML = html;
    
    // Nạp nội dung bài đầu tiên lên ô bên trái một cách an toàn khi khởi động
    if (data.length > 0) { 
        var rows = zone.getElementsByClassName("row-news");
        if (rows.length > 0) {
            rows[0].classList.add("active"); // Chỉ tô màu xanh cho dòng 1 chứ không kích hoạt click
            napDuLieuXemTruoc(0); // Nạp chữ và ảnh sang trái
        }
    }
}

// 2. HÀM XỬ LÝ KHI NGƯỜI DÙNG TỰ TAY CLICK CHUỘT LÊN DÒNG TIN
function changeNews(idx, element) {
    // Nếu dòng này ĐÃ ĐANG ĐƯỢC CHỌN (có chữ active) -> Người dùng click lần 2 -> CHUYỂN TRANG
    if (element && element.classList.contains("active")) {
        goToLink();
        return;
    }

    // Nếu click dòng khác -> Xóa active cũ, tô màu xanh active cho dòng mới
    var rows = document.getElementsByClassName("row-news");
    for (var j = 0; j < rows.length; j++) { rows[j].classList.remove("active"); }
    if (element) element.classList.add("active");
    
    // Nạp nội dung sang ô xem trước bên trái
    napDuLieuXemTruoc(idx);
}

// HÀM PHỤ HỖ TRỢ NẠP CHỮ VÀ ẢNH SANG Ô TRÁI
function napDuLieuXemTruoc(idx) {
    var currentData = window.activeData[idx];
    document.getElementById("p-title").innerHTML = currentData.title;
    document.getElementById("p-desc").innerHTML = "📅 " + currentData.date;
    
    var pImg = document.getElementById("p-img");
    if (currentData.img && !currentData.img.includes("ibb.co")) { 
        pImg.src = currentData.img; 
        pImg.style.display = "block"; 
    } else { 
        pImg.src = "";
        pImg.style.display = "none"; 
    }
    currentUrl = currentData.url;
}

function goToLink() { if (currentUrl && currentUrl !== "#") { window.parent.location.href = currentUrl; } }

// KHỞI ĐỘNG MẶC ĐỊNH
render(DATA_1);

document.getElementById("tab1").onclick = function() { selectTab("tab1", DATA_1); };
document.getElementById("tab2").onclick = function() { selectTab("tab2", DATA_2); };

function selectTab(tabId, data) {
    var tabs = document.getElementsByClassName("t-btn");
    for (var i = 0; i < tabs.length; i++) { tabs[i].classList.remove("active"); }
    document.getElementById(tabId).classList.add("active"); 
    render(data); // Tải danh sách mới của tab đó
}

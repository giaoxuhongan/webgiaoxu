<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box Tin Tức</title>

<style>
:root { 
    --xanh: #17720b; 
    --blue: #0f6204; 
    --den: #ffffff; 
    --xam: #ffffff; 
    --bg: #046c04; 
} 

* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; } 
body { background: #ffffff; padding: 15px; } 

.sh-khoi-bao-ve-he-thong {
    max-width: 1200px;
    margin: 0 auto;
    
}

.t-header { 
    display: flex; 
    justify-content: space-between; 
    align-items: flex-end; 
    border-bottom: 2px solid var(--xanh); 
    margin-bottom: 15px; 
    padding-bottom: 5px; 
} 
.t-title { 
    font-size: 18px; 
    font-weight: bold; 
    text-transform: uppercase; 
    color: var(--xanh); 
} 
.t-tabs { display: flex; } 
.t-btn { 
    font-size: 16px; 
    font-weight: bold; 
    color: #449d39; 
    cursor: pointer; 
    padding: 0 12px 5px 12px; 
    margin-left: 5px; 
    border-bottom: 1px solid transparent; 
    transition: all 0.2s; 
} 
.t-btn.active, 
.t-btn:hover { 
    color: var(--xanh); 
    border-bottom-color: var(--xanh); 
} 
.box-flex { 
    display: flex; 
    width: 100%;
    height: 440px; 
    border: 1px solid #ddd; 
    border-radius: 8px; 
    overflow: hidden; 
    background: #fafafa; /*MÀU NỀN BOX LỚN*/ 
    position: relative; 
} 
.col-left { 
    width: 65%; 
    padding: 30px; 
    border-right: 2px solid #eee; 
   /* ĐÃ XÓA dòng cursor: pointer ở đây */
} 

.img-wrap { 
    width: 100%; 
    height: 280px; 
    overflow: hidden; 
    border-radius: 6px; 
    background: #ffffff; 
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer; /* THÊM DÒNG NÀY: Để rê chuột vào ảnh đại diện lớn hiện bàn tay click */
} 

.img-big { 
    width: 100%;
    height: 100%;
    object-fit: fill; 
    display: block; 
    transition: opacity 0.2s; 
} 
.p-title { 
    font-size: 18px; 
    font-weight: bold; 
    margin: 15px 0 8px 0; 
    color: #0e7007; 
    line-height: 1.4; 
    text-align: left !important; 
    cursor: pointer; /* THÊM DÒNG NÀY: Để rê chuột vào tiêu đề lớn hiện bàn tay click */
    display: block; /* THÊM DÒNG NÀY: Giúp vùng click vừa vặn với chữ */
    width: 100% !important; 
} 
.p-title:hover {
    text-decoration: underline; /* THÊM KHỐI NÀY: Gạch chân tiêu đề khi rê chuột vào */
    color: #f0f6a8 !important; /* THÊM KHỐI NÀY: Đổi màu tiêu đề khi rê chuột vào */
}

 
.p-desc { 
    font-size: 13px; 
    color: #000000; 
    line-height: 1.5; 
    text-align: left !important;
    display: block !important; 
} 

.col-right { 
    width: 35%; 
    display: flex; 
    flex-direction: column; 
    background: #fFfFfa; 
    position: relative; 
    z-index: 1;
    padding-top: 10px;
     height: 420px;       /* Khống chế chiều cao bằng với khối ảnh lớn bên trái */
    overflow-y: auto; 
} 

.row-news { 
   display: flex; 
   align-items: center; 
   padding: 12px 15px; 
   border-bottom: 1px solid #eee; 
   cursor: pointer; 
   border-left: 4px solid transparent; 
   transition: all 0.2s;
} 
 
.row-news:last-child { border-bottom: none; } 

.row-news:hover {
    background: #f1fcf5;
    border-left-color: var(--blue);
}
.row-news:hover .r-title {
    color: #4b9956 !important; 
}
.row-news:hover .r-date {
    color: #000000 !important;
}

.row-news.active { 
    background: #fafafa; 
    border-left-color: var(--blue);
    
}

.thumb-wrap { 
    width: 80px; 
    min-width: 80px; 
    height: 55px; 
    margin-right: 12px; 
    overflow: hidden; 
    border-radius: 4px; 
    border: 1px solid #000000;
    background: #ffffff; 
}
 
.img-thumb { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
} 

.txt-wrap { overflow: hidden; } 

.r-title { 
    font-size: 14px; 
    font-weight: 600; 
    color: #000000 !important; 
    line-height: 1.4; 
    text-align: left; 
} 

.r-date { 
    font-size: 11px; 
    color: #000000 !important; 
    margin-top: 4px; 
    text-align: left; 
} 
</style>

var currentUrl = ""; 

function render(data) {
    var zone = document.getElementById("list-zone"); var html = ""; window.activeData = data; 
    for (var i = 0; i < data.length; i++) {
        var activeClass = (i === 0) ? "row-news active" : "row-news";
        
        // ➔ ĐOẠN SỬA THÔNG MINH: Chặn không cho tạo thẻ <img> nếu dính link lỗi ibb.co
        var imgHtml = (data[i].img && !data[i].img.includes("ibb.co")) ? '<img src="' + data[i].img + '" class="img-thumb">' : '';
        
        html += '<div class="' + activeClass + '" onclick="changeNews(' + i + ', this)">' +
                '<div class="thumb-wrap">' + imgHtml + '</div>' +
                '<div class="txt-wrap"><div class="r-title">' + data[i].title + '</div><div class="r-date">📅 ' + data[i].date + '</div></div>' +
                '</div>';
    }
    zone.innerHTML = html;
    if (data.length > 0) { changeNews(0, document.getElementsByClassName("row-news")[0]); }
}


function changeNews(idx, element) {
    var rows = document.getElementsByClassName("row-news");
    for (var j = 0; j < rows.length; j++) { rows[j].classList.remove("active"); }
    if(element) element.classList.add("active");
    var currentData = window.activeData[idx];
    document.getElementById("p-title").innerHTML = currentData.title;
    document.getElementById("p-desc").innerHTML = "📅 " + currentData.date;
    
    var pImg = document.getElementById("p-img");
    
    // ➔ ĐOẠN SỬA THÔNG MINH: Nếu link trống hoặc chứa chữ ibb.co thì ẨN HẲN ẢNH ĐI
    if (currentData.img && !currentData.img.includes("ibb.co")) { 
        pImg.src = currentData.img; 
        pImg.style.display = "block"; 
    } else { 
        pImg.src = "";
        pImg.style.display = "none"; // Ẩn hoàn toàn, mất luôn logo góc trái!
    }
    currentUrl = currentData.url;
}

function selectTab(tabId, data) {
    var tabs = document.getElementsByClassName("t-btn");
    for (var i = 0; i < tabs.length; i++) { tabs[i].classList.remove("active"); }
    document.getElementById(tabId).classList.add("active"); render(data);

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Video Box</title>
<style>

*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6f4;
    color:#17352a;
    
}


.yvb-box{
    width:100%;
    max-width:1200px;
    background:#fff;
    border:1px solid #B0ADAD;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 8px 25px rgba(16,64,45,.10);
    margin: 0px auto 0px auto; /* 0px phía trên giúp kéo sát lề đỉnh, 20px lề dưới */
}


.yvb-header{
     min-width:0;
     display:flex;
     align-items:
     center;gap:18px;
     padding:14px 18px;
     background:#0f5132; /* Màu nền thanh tiêu đề*/
     color:#fff} /* Màu chữ tiêu đề box*/

.yvb-title{flex:0 0 auto;
           margin:0;font-size:21px;
           line-height:1.3;
           font-weight:700}

.yvb-tabs{
     min-width:0;
     max-width:70%;
     margin-left:auto;
     display:flex;
     align-items:center;
     justify-content:flex-end;
     gap:5px;
     overflow-x:auto;
     scrollbar-width:none}

.yvb-tabs::-webkit-scrollbar{display:none}

.yvb-tab{flex:0 0 auto;
         border:0;
         border-radius:6px;
         padding:7px 30px;
         background:transparent;
         color:#dcebe4;
         font-size:14px;
         line-height:1.2;
         cursor:pointer;
         white-space:nowrap}

.yvb-tab:hover{
     background:rgba(255,255,255,.10);
     color:#fff}

.yvb-tab.is-active{
     background:#fff;
     color:#0f5132;
     font-weight:700}

.yvb-content{display:flex;
     align-items:stretch;
     width:100%;min-width:0}

.yvb-left-wrap{
          width:65%;
          min-width:0;
          background:#fff;
          display:flex;
          flex-direction:column}

.yvb-player-wrap{width:100%;
                 min-width:0;
                 background:#000;
                 aspect-ratio:16/9}

.yvb-player{display:block;
     width:100%;
     height:100%;
     border:0}

.yvb-video-title{
    margin:0 !important;
    padding:9px 14px 10px !important;
    min-height:60px !important;
    width:100% !important;
    box-sizing:border-box !important;

    background:#f4f8f6 !important;
    color:#0f5132 !important;

    font-size:16px !important;
    line-height:1.35 !important;
    font-weight:700 !important;

    text-align:left !important;
    display:block !important;

    float:none !important;
    clear:both !important;
}
.yvb-list-wrap{
          width:35%;
          min-width:0;
          padding:14px;
          background:#f6faf8;
          border-left:2px solid #d8e5df;
          display:flex;flex-direction:column}

.yvb-box .yvb-list-heading{
    margin:0 0 10px 0 !important;
    padding:0 !important;

    color:#0f5132 !important;
    font-size:16px !important;
    font-weight:700 !important;

    text-align:left !important;
    display:block !important;
    width:100% !important;
    box-sizing:border-box !important;

    float:none !important;
    clear:both !important;
                  
}
.yvb-list{
    height:400px;
    max-height:400px;
    overflow-y:auto;
    overflow-x:hidden;
    padding-right:5px;
    display:flex;
    flex-direction:column;
    gap:7px;
    scrollbar-width:thin;
    scrollbar-color:#39785a #dfeae5
}
/* Desktop: hiển thị khoảng 5 video; video tiếp theo sẽ cuộn */
.yvb-list::-webkit-scrollbar{width:7px}
.yvb-list::-webkit-scrollbar-track{background:#dfeae5;border-radius:10px}
.yvb-list::-webkit-scrollbar-thumb{background:#39785a;border-radius:10px}
.yvb-list::-webkit-scrollbar-thumb:hover{background:#0f5132}
.yvb-item{
    display:flex;
    flex:0 0 calc((100% - 38px) / 6);
    height:calc((100% - 38px) / 6);
    min-height:0;
    gap:8px;
    width:100%;
    margin:0;
    padding:4px;
    border:1px solid #d7e3dd;
    border-radius:7px;
    background:#fff;
    cursor:pointer;
    text-align:left;
    transition:border-color .2s,background .2s,transform .15s
}
.yvb-item:last-child{margin-bottom:0}

.yvb-item:hover{
          border-color:#7aa88f;
          background:#f0f7f3;
          transform:translateY(-1px)}

.yvb-item.is-active{
          border-color:#0f5132;
          background:#e8f3ed}

.yvb-thumb{
         flex:0 0 82px;
         width:82px;
         height:90%;
         object-fit:cover;
         border-radius:5px;
         background:#dfe6e2}

.yvb-item-title{
    min-width:0;
    align-self:center;
    color:#183a2d;
    font-size:13px;
    line-height:1.35;
    display:-webkit-box;
    -webkit-box-orient:vertical;
    -webkit-line-clamp:2;
    overflow:hidden;
}
.yvb-empty{
     padding:20px 10px;
     text-align:center;
     color:#6b7d74;font-size:13px}

/*==========================PHẦN ĐIỆN THOẠI======================*/
@media(max-width:768px){

.yvb-box{
    margin:15px auto;
    border-radius:9px
    
}

.yvb-header{
    display:block;
    padding:12px
}

.yvb-title{
    margin-bottom:10px;
    font-size:19px
}

.yvb-tabs{
    width:100%;
    max-width:none;
    margin-left:0;
    justify-content:flex-start;
    overflow-x:auto
}

.yvb-content{
    display:block
}

.yvb-left-wrap,
.yvb-list-wrap{
    width:100%
}

.yvb-list-wrap{
    border-left:0;
    border-top:1px solid #d8e5df
}

/* DANH SÁCH MOBILE */
.yvb-list{
    height:200px;
    max-height:350px;
    flex:none;
    display:flex;
    flex-direction:column;
    gap:7px;
}

.yvb-list .yvb-item{
    flex:0 0 calc((100% - 35px) / 3);
    height:calc((100% - 35px) / 3);
    min-height:0;
}

.yvb-thumb{
    flex-basis:50px;
    width:80px;
    height:45px
}
}
@media(max-width:480px){
    .yvb-list .yvb-item .yvb-thumb{
        flex:0 0 75px !important;
        width:75px !important;
        height:42px !important;
        max-height:42px !important;
        min-height:42px !important;
        object-fit:cover !important;
        object-position:center center !important;
        display:block !important;
        align-self:center !important;
        margin:0 !important;
        padding:0 !important;
        border:0 !important;
    }
}
</style>

const YVB_CONFIG = {
    thumbnail: id => `https://i.ytimg.com/vi/${id}/hqdefault.jpg`,
    player: id => `https://www.youtube-nocookie.com/embed/${id}?rel=0`,
    defaultCategory: "Meditation",
    defaultVideoIndex: 0
};

const yvbState = {
    categoryId: YVB_CONFIG.defaultCategory,
    videoIndex: YVB_CONFIG.defaultVideoIndex
};

function yvbValidYouTubeId(id) {
    return typeof id === "string" && /^[A-Za-z0-9_-]{11}$/.test(id);
}

function yvbGetCategory(id) {
    return YVB_DATA.categories.find(category => category.id === id);
}

function yvbRenderTabs() {
    const tabs = document.getElementById("yvbTabs");
    tabs.replaceChildren();

    YVB_DATA.categories.forEach(category => {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "yvb-tab";
        button.textContent = category.name;

        if (category.id === yvbState.categoryId) {
            button.classList.add("is-active");
        }

        button.addEventListener("click", () => {
            yvbState.categoryId = category.id;
            yvbState.videoIndex = 0;

            yvbRenderTabs();
            yvbRenderList();
            yvbPlayCurrent();
        });

        tabs.appendChild(button);
    });
}

function yvbRenderList() {
    const list = document.getElementById("yvbList");
    const heading = document.getElementById("yvbListHeading");

    list.replaceChildren();

    const category = yvbGetCategory(yvbState.categoryId);

    if (!category || !Array.isArray(category.videos)) {
        heading.textContent = "Danh sách video";
        return;
    }

    heading.textContent = category.name;

    if (category.videos.length === 0) {
        const empty = document.createElement("div");
        empty.className = "yvb-empty";
        empty.textContent = "Chưa có video trong chủ đề này.";
        list.appendChild(empty);
        return;
    }

    category.videos.forEach((video, index) => {
        if (!yvbValidYouTubeId(video.youtubeId)) return;

        const item = document.createElement("button");
        item.type = "button";
        item.className = "yvb-item";
        item.setAttribute("role", "listitem");

        if (index === yvbState.videoIndex) {
            item.classList.add("is-active");
        }

        const thumbnail = document.createElement("img");
        thumbnail.className = "yvb-thumb";
        thumbnail.src = YVB_CONFIG.thumbnail(video.youtubeId);
        thumbnail.alt = "";
        thumbnail.loading = "lazy";
        thumbnail.referrerPolicy = "strict-origin-when-cross-origin";

        const title = document.createElement("div");
        title.className = "yvb-item-title";
        title.textContent = video.title || "Video không có tiêu đề";

        item.appendChild(thumbnail);
        item.appendChild(title);

        item.addEventListener("click", () => {
            yvbState.videoIndex = index;
            yvbRenderList();
            yvbPlayCurrent();
        });

        list.appendChild(item);
    });
}

function yvbPlayCurrent() {
    const player = document.getElementById("yvbPlayer");
    const titleBox = document.getElementById("yvbVideoTitle");
    const category = yvbGetCategory(yvbState.categoryId);

    if (!category || !category.videos.length) {
        player.src = "";
        titleBox.textContent = "";
        return;
    }

    const video = category.videos[yvbState.videoIndex];

    if (!video || !yvbValidYouTubeId(video.youtubeId)) {
        player.src = "";
        titleBox.textContent = "";
        return;
    }

    player.src = YVB_CONFIG.player(video.youtubeId);
    titleBox.textContent = video.title || "Video không có tiêu đề";
}

function yvbInit() {
    document.getElementById("yvbTitle").textContent = YVB_DATA.title;

    if (!yvbGetCategory(YVB_CONFIG.defaultCategory) && YVB_DATA.categories.length) {
        yvbState.categoryId = YVB_DATA.categories[0].id;
    }

    yvbRenderTabs();
    yvbRenderList();
    yvbPlayCurrent();
}

document.addEventListener("DOMContentLoaded", yvbInit);
